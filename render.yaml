# Render Blueprint for Room by Room — PREPARED FOR REVIEW, NOT APPLIED.
# Applying this creates paid resources (≈ US$20.30/month before tax, see docs/deployment-render.md);
# do it only after explicit founder approval.
#
# Project: there is deliberately NO `projects:` key. Declaring one could create a second
# "Room by Room" project. After the Blueprint sync, move the three resources (and the env group)
# into the EXISTING "Room by Room" project from the dashboard (select → Move).
#
# Secrets: ANTHROPIC_API_KEY is NOT declared here. After creation, add it privately to the
# `room-by-room-shared` env group in the dashboard; both services inherit it from the group.
# Until then the app shows "Automatic extraction not configured" and manual entry works.

envVarGroups:
  - name: room-by-room-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_HTTPS
        value: "1"
      - key: DJANGO_SECURE_COOKIES
        value: "1"
      - key: PRIVATE_STORAGE_BACKEND
        value: database
      - key: STATIC_MANIFEST
        value: "1"
      - key: RECEIPT_EXTRACTOR
        value: anthropic
      - key: RECEIPT_MODEL
        value: claude-haiku-4-5-20251001

services:
  - type: web
    name: room-by-room-web
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: "off"     # deploys are manual and deliberate
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: room-by-room-shared
      - key: DATABASE_URL
        fromDatabase:
          name: room-by-room-db
          property: connectionString

  - type: worker
    name: room-by-room-receipts
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_receipts --watch --interval 3
    maxShutdownDelaySeconds: 90   # SIGTERM: the job in hand (≤ 60 s provider timeout) finishes, nothing new is claimed
    envVars:
      - fromGroup: room-by-room-shared
      - key: DATABASE_URL
        fromDatabase:
          name: room-by-room-db
          property: connectionString

databases:
  - name: room-by-room-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false   # growth is an approved cost change, never automatic
    databaseName: roombyroom
    user: roombyroom
    ipAllowList: []          # no public access; services connect over Render's private network
