<div class="field"><label for="f-merchant">Merchant{% if "merchant" in extraction.uncertain_fields %} <span class="badge badge-warning">Check</span>{% endif %}</label>
  <input type="text" id="f-merchant" name="merchant" value="{{ editor.header.merchant }}" maxlength="120" placeholder="e.g. Timber merchant"></div>
<div class="field"><label for="f-date">Date{% if "receipt_date" in extraction.uncertain_fields %} <span class="badge badge-warning">Check</span>{% endif %}</label>
  <input type="date" id="f-date" name="transaction_date" value="{{ editor.header.transaction_date }}" required></div>
<div class="field"><label for="f-total">Purchase total (£, GBP){% if "total" in extraction.uncertain_fields %} <span class="badge badge-warning">Check</span>{% endif %}</label>
  <input type="text" inputmode="decimal" id="f-total" name="total" value="{{ editor.header.total }}" data-total placeholder="Optional" aria-describedby="total-help"></div>
